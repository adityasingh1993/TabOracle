<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabOracle Favicon Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-case {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .favicon-test {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: #f0f0f0;
            display: block;
            object-fit: cover;
        }
        .test-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .test-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>TabOracle Favicon Debug Test</h1>
    
    <div class="test-case">
        <div class="test-title">Debug: Favicon URL Generation</div>
        <div class="test-description">Testing the getFaviconUrl function with different tab types</div>
        <div id="debug-output"></div>
    </div>

    <div class="test-case">
        <div class="test-title">Test Cases</div>
        <div class="test-description">Visual test of different favicon scenarios</div>
        <div id="test-output"></div>
    </div>

    <script>
        // Copy the getFaviconUrl function from popup.js
        function getFaviconUrl(tab) {
            // Debug logging
            console.log('🔍 TabOracle: Getting favicon for tab:', {
                id: tab.id,
                title: tab.title,
                url: tab.url,
                favIconUrl: tab.favIconUrl
            });
            
            // If we have a favicon URL, use it
            if (tab.favIconUrl && tab.favIconUrl.trim() !== '') {
                console.log('✅ TabOracle: Using existing favicon:', tab.favIconUrl);
                return tab.favIconUrl;
            }
            
            // For chrome-extension:// URLs, use a special icon
            if (tab.url && tab.url.startsWith('chrome-extension://')) {
                console.log('🔧 TabOracle: Using extension icon for:', tab.url);
                return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#ff6b35"/><text x="8" y="12" text-anchor="middle" fill="white" font-size="10" font-family="Arial">E</text></svg>';
            }
            
            // For new tabs or tabs without favicon, try to generate one from the domain
            if (tab.url && tab.url.startsWith('http')) {
                try {
                    const url = new URL(tab.url);
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=32`;
                    console.log('🌐 TabOracle: Using Google favicon service:', faviconUrl);
                    return faviconUrl;
                } catch (e) {
                    console.warn('⚠️ TabOracle: URL parsing failed:', e);
                    // If URL parsing fails, fall back to default
                }
            }
            
            // For chrome:// URLs, use a special icon
            if (tab.url && tab.url.startsWith('chrome://')) {
                console.log('🔧 TabOracle: Using Chrome icon for:', tab.url);
                return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#4285f4"/><text x="8" y="12" text-anchor="middle" fill="white" font-size="10" font-family="Arial">C</text></svg>';
            }
            
            // For new tabs (chrome://newtab/), use a special icon
            if (tab.url === 'chrome://newtab/') {
                console.log('🆕 TabOracle: Using new tab icon');
                return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#34a853"/><text x="8" y="12" text-anchor="middle" fill="white" font-size="10" font-family="Arial">+</text></svg>';
            }
            
            // Default fallback for new tabs or invalid URLs
            console.log('❓ TabOracle: Using default fallback icon');
            return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#ccc"/><text x="8" y="12" text-anchor="middle" fill="white" font-size="10" font-family="Arial">?</text></svg>';
        }

        // Test cases
        const testCases = [
            { 
                id: 1, 
                title: 'New Tab', 
                url: 'chrome://newtab/', 
                favIconUrl: '',
                description: 'New tab page'
            },
            { 
                id: 2, 
                title: 'Chrome Settings', 
                url: 'chrome://settings/', 
                favIconUrl: '',
                description: 'Chrome settings page'
            },
            { 
                id: 3, 
                title: 'Extension Page', 
                url: 'chrome-extension://abcdefghijklmnop/options.html', 
                favIconUrl: '',
                description: 'Extension options page'
            },
            { 
                id: 4, 
                title: 'Google', 
                url: 'https://google.com', 
                favIconUrl: '',
                description: 'Regular website'
            },
            { 
                id: 5, 
                title: 'Tab with Existing Favicon', 
                url: 'https://github.com', 
                favIconUrl: 'https://github.com/favicon.ico',
                description: 'Tab with existing favicon'
            },
            { 
                id: 6, 
                title: 'Empty URL', 
                url: '', 
                favIconUrl: '',
                description: 'Tab with empty URL'
            }
        ];

        // Run tests and display results
        function runTests() {
            const debugOutput = document.getElementById('debug-output');
            const testOutput = document.getElementById('test-output');
            
            let debugHtml = '<div class="debug-info">';
            debugHtml += '<h4>Debug Output:</h4>';
            
            let testHtml = '';
            
            testCases.forEach((testCase, index) => {
                console.log(`\n--- Test Case ${index + 1}: ${testCase.description} ---`);
                
                const faviconUrl = getFaviconUrl(testCase);
                
                debugHtml += `<div><strong>Test ${index + 1}:</strong> ${testCase.description}</div>`;
                debugHtml += `<div>Input: ${JSON.stringify(testCase, null, 2)}</div>`;
                debugHtml += `<div>Output: ${faviconUrl}</div><br>`;
                
                testHtml += `
                    <div class="favicon-test">
                        <img class="favicon" src="${faviconUrl}" alt="favicon" onerror="this.src='data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 16 16&quot;><rect width=&quot;16&quot; height=&quot;16&quot; fill=&quot;#ccc&quot;/><text x=&quot;8&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;white&quot; font-size=&quot;10&quot; font-family=&quot;Arial&quot;>?</text></svg>'">
                        <div>
                            <div><strong>${testCase.title}</strong></div>
                            <div style="font-size: 12px; color: #666;">${testCase.description}</div>
                            <div style="font-size: 10px; color: #999;">${testCase.url || 'No URL'}</div>
                        </div>
                    </div>
                `;
            });
            
            debugHtml += '</div>';
            debugOutput.innerHTML = debugHtml;
            testOutput.innerHTML = testHtml;
        }

        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
