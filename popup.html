<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabOracle</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TabOracle</h1>
        </div>
        
        <!-- Tabbed Search Interface -->
        <div class="search-tabs">
            <button class="search-tab active" data-tab="normal">
                <span class="tab-icon">🔍</span>
                <span class="tab-label">Normal Search</span>
            </button>
            <button class="search-tab" data-tab="category">
                <span class="tab-icon">🏷️</span>
                <span class="tab-label">Category Search</span>
            </button>
            <button class="search-tab" data-tab="smart">
                <span class="tab-icon">🧠</span>
                <span class="tab-label">Smart Search</span>
            </button>
        </div>
        
        <!-- Normal Search Tab -->
        <div class="tab-content active" id="normalSearchTab">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search tabs by title or URL..."
                    autocomplete="off"
                >
                <div class="search-icon">🔍</div>
            </div>
            
            <div class="tabs-container">
                <div id="tabsList" class="tabs-list">
                    <!-- Tabs will be populated here -->
                </div>
                
                <div id="searchResults" class="search-results" style="display: none;">
                    <!-- Search results will be shown here -->
                </div>
            </div>
        </div>
        
        <!-- Category Search Tab -->
        <div class="tab-content" id="categorySearchTab">
            <div class="category-header">
                <h3>Browse Tabs by Category</h3>
                <p>Click on a category to see related tabs</p>
                <button id="debugCategories" class="debug-button">🔍 Debug Categories</button>
            </div>
            
            <div class="categories-grid" id="categoriesGrid">
                <!-- Categories will be generated here -->
            </div>
            
            <div class="category-results" id="categoryResults" style="display: none;">
                <!-- Category results will be displayed here -->
            </div>
        </div>
        
        <!-- Smart Search Tab -->
        <div class="tab-content" id="smartSearchTab">
            <div class="smart-search-container">
                <input 
                    type="text" 
                    id="smartSearchInput" 
                    placeholder="Smart search with semantic understanding and content analysis..."
                    autocomplete="off"
                >
                <div class="search-icon">🧠</div>
            </div>
            
            <div class="smart-search-info">
                <div class="info-item">
                    <span class="info-icon">🧠</span>
                    <span>Semantic understanding</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">📄</span>
                    <span>Page content analysis</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">🔗</span>
                    <span>Concept relationships</span>
                </div>
            </div>
            
            <div class="smart-search-results" id="smartSearchResults" style="display: none;">
                <!-- Smart search results will be displayed here -->
            </div>
        </div>
        
        <div class="footer">
            <div class="tab-count" id="tabCount">0 tabs</div>
            <div class="shortcut-hint">Press Ctrl+Space anywhere to open</div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
