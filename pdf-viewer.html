<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TabOracle PDF Viewer</title>
	<style>
		body, html { margin: 0; padding: 0; height: 100%; background: #0b1020; color: #e5e7eb; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji; }
		#toolbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
		#viewer { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: auto; }
		.page { position: relative; margin: 16px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); background: #111827; }
		.canvas-layer { display: block; }
		.text-layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: auto; color: transparent; }
		.btn { background: #4f46e5; color: white; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
		.btn.secondary { background: #374151; }
		#status { margin-left: auto; font-size: 12px; color: #9ca3af; }
		input[type="text"] { background: #111827; border: 1px solid #374151; color: #e5e7eb; border-radius: 6px; padding: 6px 8px; min-width: 260px; }
	</style>
</head>
<body>
	<div id="toolbar">
		<button id="prev" class="btn">Prev</button>
		<button id="next" class="btn">Next</button>
		<div id="pageInfo">Page <span id="pageNum">1</span>/<span id="pageCount">1</span></div>
		<input type="text" id="selectionPreview" placeholder="Select text on pages..." readonly />
		<button id="explain" class="btn">Explain Selection</button>
		<button id="openSrc" class="btn secondary">Open Original</button>
		<div id="status">Loading...</div>
	</div>
	<div id="viewer"></div>

	<script src="vendor/pdfjs/pdf.min.js"></script>
	<script>
		const params = new URLSearchParams(location.search);
		const src = params.get('src');
		const viewer = document.getElementById('viewer');
		const statusEl = document.getElementById('status');
		const pageNumEl = document.getElementById('pageNum');
		const pageCountEl = document.getElementById('pageCount');
		const selectionPreview = document.getElementById('selectionPreview');
		const openSrcBtn = document.getElementById('openSrc');
		const explainBtn = document.getElementById('explain');
		const prevBtn = document.getElementById('prev');
		const nextBtn = document.getElementById('next');
		let pdfDoc = null;
		let currentPage = 1;
		const pageCache = new Map();

		openSrcBtn.onclick = () => { if (src) chrome.tabs.create({ url: src }); };
		prevBtn.onclick = () => goToPage(Math.max(1, currentPage - 1));
		nextBtn.onclick = () => goToPage(Math.min(pdfDoc?.numPages || 1, currentPage + 1));

		document.addEventListener('selectionchange', () => {
			const text = window.getSelection().toString();
			selectionPreview.value = text.trim().slice(0, 200);
		});

		explainBtn.onclick = async () => {
			const text = window.getSelection().toString().trim();
			if (!text) { status('Select some text first'); return; }
			try {
				status('Generating explanation...');
				// Try language model in background
				const prompt = `Explain the following text clearly and concisely.\n\nText:\n${text}`;
				const resp = await new Promise((resolve) => {
					chrome.runtime.sendMessage({ action: 'handleAIExplanationRequest', prompt, selectedText: text }, resolve);
				});
				if (resp && resp.success) {
					console.group('🧠 TabOracle PDF Viewer: Explanation');
					console.log(text);
					console.log('—');
					console.log(resp.explanation);
					console.groupEnd();
					status('Explanation logged to console');
				} else {
					status('AI not available. Try again later.');
				}
			} catch (e) {
				status('Explain failed: ' + e.message);
			}
		};

		function status(msg) { statusEl.textContent = msg; }

		(async function init() {
			if (!src) { status('No PDF source provided'); return; }
			status('Loading PDF...');
			try {
				pdfjsLib.GlobalWorkerOptions.workerSrc = chrome.runtime.getURL('vendor/pdfjs/pdf.worker.min.js');
				// Try direct URL first
				let loaded = false;
				try {
					const loadingTask = pdfjsLib.getDocument({ url: src, withCredentials: true });
					pdfDoc = await loadingTask.promise;
					loaded = true;
				} catch (e) {
					console.warn('⚠️ Direct PDF load failed, trying background fetch:', e.message);
				}
				if (!loaded) {
					const fetched = await new Promise(resolve => {
						chrome.runtime.sendMessage({ action: 'fetchPdfAsData', url: src }, resolve);
					});
					if (fetched && fetched.success && fetched.data) {
						const loadingTask2 = pdfjsLib.getDocument({ data: fetched.data });
						pdfDoc = await loadingTask2.promise;
						loaded = true;
					} else {
						throw new Error('Background fetch failed: ' + (fetched?.error || 'unknown error'));
					}
				}
				pageCountEl.textContent = pdfDoc.numPages;
				status('Loaded');
				await renderPage(1);
			} catch (e) {
				status('Failed to load PDF: ' + e.message);
			}
		})();

		async function goToPage(n) { if (n !== currentPage) await renderPage(n); }

		async function renderPage(num) {
			currentPage = num;
			pageNumEl.textContent = num;
			status(`Rendering page ${num}...`);
			const page = await pdfDoc.getPage(num);
			const viewport = page.getViewport({ scale: 1.5 });
			
			let pageEl = pageCache.get(num);
			if (!pageEl) {
				pageEl = document.createElement('div');
				pageEl.className = 'page';
				const canvas = document.createElement('canvas');
				canvas.className = 'canvas-layer';
				const textLayer = document.createElement('div');
				textLayer.className = 'text-layer';
				pageEl.appendChild(canvas);
				pageEl.appendChild(textLayer);
				pageCache.set(num, pageEl);
			}
			pageEl.style.width = viewport.width + 'px';
			pageEl.style.height = viewport.height + 'px';
			viewer.innerHTML = '';
			viewer.appendChild(pageEl);

			const canvas = pageEl.querySelector('.canvas-layer');
			const ctx = canvas.getContext('2d');
			canvas.width = viewport.width; canvas.height = viewport.height;
			await page.render({ canvasContext: ctx, viewport }).promise;

			const textLayerDiv = pageEl.querySelector('.text-layer');
			textLayerDiv.innerHTML = '';
			const textContent = await page.getTextContent();
			pdfjsLib.renderTextLayer({
				textContent,
				container: textLayerDiv,
				viewport,
				textDivs: []
			});
			status('');
		}
	</script>
</body>
</html>
