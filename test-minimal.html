<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabOracle Minimal Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .test-button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .test-button:hover { background: #5a6fd8; }
        .result { background: #f8f9fa; padding: 15px; border-radius: 4px; margin: 10px 0; font-family: monospace; }
        .success { border-left: 4px solid #28a745; }
        .error { border-left: 4px solid #dc3545; }
        .info { border-left: 4px solid #17a2b8; }
    </style>
</head>
<body>
    <h1>🧪 TabOracle Minimal Test</h1>
    <p>This page tests the minimal version of TabOracle to isolate any issues.</p>
    
    <div class="test-section">
        <h2>🔍 Basic Extension Tests</h2>
        <button class="test-button" onclick="testPing()">Test Ping</button>
        <button class="test-button" onclick="testGetTabs()">Test Get Tabs</button>
        <div id="basic-results"></div>
    </div>
    
    <div class="test-section">
        <h2>📊 Extension Status</h2>
        <div id="status-results"></div>
    </div>
    
    <div class="test-section">
        <h2>🚨 Error Log</h2>
        <div id="error-log"></div>
    </div>

    <script>
        // Test functions
        function logResult(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            
            if (type === 'error') {
                document.getElementById('error-log').appendChild(resultDiv);
            } else if (type === 'success') {
                document.getElementById('basic-results').appendChild(resultDiv);
            }
        }

        function testPing() {
            try {
                chrome.runtime.sendMessage({ action: 'ping' }, (response) => {
                    if (chrome.runtime.lastError) {
                        logResult(`Ping failed: ${chrome.runtime.lastError.message}`, 'error');
                    } else if (response && response.status === 'ok') {
                        logResult(`✅ Ping successful: ${response.message}`, 'success');
                    } else {
                        logResult(`❌ Ping response invalid: ${JSON.stringify(response)}`, 'error');
                    }
                });
            } catch (error) {
                logResult(`❌ Ping test error: ${error.message}`, 'error');
            }
        }

        function testGetTabs() {
            try {
                chrome.runtime.sendMessage({ action: 'getAllTabs' }, (response) => {
                    if (chrome.runtime.lastError) {
                        logResult(`Get tabs failed: ${chrome.runtime.lastError.message}`, 'error');
                    } else if (response && response.tabs) {
                        logResult(`✅ Get tabs successful: ${response.tabs.length} tabs found`, 'success');
                    } else {
                        logResult(`❌ Get tabs response invalid: ${JSON.stringify(response)}`, 'error');
                    }
                });
            } catch (error) {
                logResult(`❌ Get tabs test error: ${error.message}`, 'error');
            }
        }

        function checkExtensionStatus() {
            try {
                if (typeof chrome !== 'undefined' && chrome.runtime) {
                    logResult('✅ Chrome runtime API available', 'success');
                    
                    chrome.runtime.sendMessage({ action: 'ping' }, (response) => {
                        if (chrome.runtime.lastError) {
                            logResult(`❌ Extension communication failed: ${chrome.runtime.lastError.message}`, 'error');
                        } else {
                            logResult('✅ Extension communication working', 'success');
                        }
                    });
                } else {
                    logResult('❌ Chrome runtime API not available', 'error');
                }
            } catch (error) {
                logResult(`❌ Status check error: ${error.message}`, 'error');
            }
        }

        // Run initial tests
        window.addEventListener('load', () => {
            logResult('🚀 Page loaded, running extension tests...', 'info');
            setTimeout(checkExtensionStatus, 1000);
        });

        // Log any console errors
        window.addEventListener('error', (event) => {
            logResult(`❌ JavaScript error: ${event.message} at ${event.filename}:${event.lineno}`, 'error');
        });

        // Log unhandled promise rejections
        window.addEventListener('unhandledrejection', (event) => {
            logResult(`❌ Unhandled promise rejection: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
